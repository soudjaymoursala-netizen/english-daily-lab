<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>English Daily Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans:wght@400&display=swap">
<style>
/* Layout : bandeau pétrole avec niveau et série, onglets en pilules, colonne de travail de cartes douces. */
:root {
  --bg: #f3f6f8;
  --surface: #ffffff;
  --surface-2: #eef2f5;
  --ink: #0d1b24;
  --muted: #5b6b77;
  --line: #e1e7ec;
  --brand: #0f3b46;
  --brand-2: #0a2a33;
  --on-brand: #eaf6f5;
  --accent: #0e8f86;
  --accent-soft: #dcf2ef;
  --accent-ink: #ffffff;
  --gold: #a87a22;
  --gold-soft: #f6ecd6;
  --signal: #b4570b;
  --signal-soft: #fcebd9;
  --good: #16803c;
  --good-soft: #dff4e6;
  --bad: #b42318;
  --bad-soft: #fbe4e1;
  --shadow: 0 1px 2px rgb(13 27 36 / 0.05), 0 10px 30px -12px rgb(13 27 36 / 0.14);
  --f-ui: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-ipa: "Noto Sans", "Doulos SIL", "Charis SIL", "Segoe UI", "Arial Unicode MS", sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #081015; --surface: #0f1a20; --surface-2: #16242c; --ink: #e5eef2; --muted: #8da1ad; --line: #1f313a;
    --brand: #0c2c35; --brand-2: #071c22; --on-brand: #e3f3f1; --accent: #36c3b5; --accent-soft: #10332f; --accent-ink: #03211e;
    --gold: #e2b65e; --gold-soft: #33280f; --signal: #f1a453; --signal-soft: #36230f; --good: #4fd685; --good-soft: #0f2c1b;
    --bad: #f47f75; --bad-soft: #3a1714; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 10px 30px -12px rgb(0 0 0 / 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #081015; --surface: #0f1a20; --surface-2: #16242c; --ink: #e5eef2; --muted: #8da1ad; --line: #1f313a;
  --brand: #0c2c35; --brand-2: #071c22; --on-brand: #e3f3f1; --accent: #36c3b5; --accent-soft: #10332f; --accent-ink: #03211e;
  --gold: #e2b65e; --gold-soft: #33280f; --signal: #f1a453; --signal-soft: #36230f; --good: #4fd685; --good-soft: #0f2c1b;
  --bad: #f47f75; --bad-soft: #3a1714; --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 10px 30px -12px rgb(0 0 0 / 0.6); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; text-wrap: balance; font-weight: 800; }
.wrap { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* En-tête */
.band { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%); color: var(--on-brand); margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); }
.band-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-block: 16px 14px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 12px; }
.mark { width: 38px; height: 38px; border-radius: 11px; background: rgb(255 255 255 / 0.1); display: grid; place-items: center; font-weight: 800; font-size: 0.95rem; letter-spacing: -0.04em; border: 1px solid rgb(255 255 255 / 0.15); }
.logo h1 { font-size: 1.15rem; font-weight: 800; }
.logo .sub { font-family: var(--f-mono); font-size: 0.7rem; opacity: 0.7; letter-spacing: 0.04em; text-transform: uppercase; }
.band-stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; background: rgb(255 255 255 / 0.08); border: 1px solid rgb(255 255 255 / 0.12); font-size: 0.82rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.pill.level { background: var(--gold); color: #1d1405; border-color: transparent; font-weight: 800; }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-block: 8px; }
nav.tabs .wrap::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none; padding: 7px 14px; border-radius: 99px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
nav.tabs a:hover { color: var(--ink); background: var(--surface-2); }
nav.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
nav.tabs .count { font-family: var(--f-mono); font-size: 0.7rem; background: var(--signal); color: #fff; border-radius: 99px; padding: 0 6px; margin-left: 6px; }

main { padding-block: 22px 72px; display: grid; gap: 18px; }
.head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
.head h2 { font-size: 1.7rem; }
.head p { margin: 4px 0 0; color: var(--muted); max-width: 62ch; }
.eyebrow { font-family: var(--f-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* Surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; min-width: 0; box-shadow: var(--shadow); }
.panel h3 { font-size: 1.1rem; font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.card.done { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.cards { display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.notice { background: var(--accent-soft); border-radius: 12px; padding: 11px 14px; font-size: 0.9rem; }
.notice.warn { background: var(--signal-soft); }

.meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.meta .l { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.04em; text-transform: uppercase; }
.chip.lv { background: var(--gold-soft); color: var(--gold); font-weight: 500; }
.term { font-size: 1.6rem; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.term.expr { font-size: 1.3rem; font-weight: 700; }
.ipa { font-family: var(--f-ipa); color: var(--accent); font-size: 1.05rem; }
.fr { font-size: 1.02rem; font-weight: 600; }
.example { border-left: 3px solid var(--accent-soft); padding-left: 12px; display: grid; gap: 2px; }
.example .en { font-weight: 600; }
.example .tr { color: var(--muted); font-size: 0.92rem; }
.tip { background: var(--signal-soft); border-radius: 12px; padding: 9px 13px; font-size: 0.9rem; }
.tip .k { font-family: var(--f-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--signal); display: block; }
.fast { font-family: var(--f-mono); font-size: 0.84rem; color: var(--muted); overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions.end { justify-content: flex-end; }
.actions.between { justify-content: space-between; }

.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 11px; padding: 8px 13px; font-weight: 600; font-size: 0.88rem; text-decoration: none; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1d1405; }
.btn.audio { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 35%, var(--line)); }
.btn.audio.playing { background: var(--signal-soft); }
.btn.mic.live { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.btn.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn.big { padding: 13px 20px; font-size: 1rem; border-radius: 14px; }

.front { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 0; }
.front .hint { color: var(--muted); font-size: 0.92rem; flex: 1 1 220px; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 0.88rem; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / 0.1); }
.switch { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.9rem; cursor: pointer; user-select: none; }
.switch input { accent-color: var(--accent); width: 16px; height: 16px; }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar.gold > span { background: var(--gold); }
.dots { display: grid; grid-template-columns: repeat(var(--n, 10), 1fr); gap: 4px; }
.dots span { height: 6px; border-radius: 3px; background: var(--line); }
.dots span.on { background: var(--accent); }

.result { border-radius: 12px; padding: 11px 13px; background: var(--surface-2); display: grid; gap: 6px; font-size: 0.95rem; }
.result .score { font-family: var(--f-mono); font-weight: 500; }
.words { line-height: 1.95; }
.words span { padding: 1px 4px; border-radius: 4px; margin-right: 2px; }
.words .ok { background: var(--good-soft); color: var(--good); }
.words .miss { background: var(--bad-soft); color: var(--bad); text-decoration: underline dotted; }
.words .extra { color: var(--muted); text-decoration: line-through; }
.partial { color: var(--muted); font-style: italic; }

.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 9px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 13px; padding: 13px 14px; font-size: 0.95rem; font-weight: 500; }
.choice:hover:not([disabled]) { background: var(--surface-2); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.choice.right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.choice.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.choice[disabled] { cursor: default; }
.prompt { font-size: 1.25rem; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.prompt .blank { display: inline-block; min-width: 64px; border-bottom: 2px solid var(--accent); }

textarea, input[type="text"], select { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
textarea { resize: vertical; min-height: 84px; }

.grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grade button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px; display: grid; gap: 2px; font-weight: 700; }
.grade button small { font-family: var(--f-mono); font-weight: 400; color: var(--muted); font-size: 0.7rem; }
.grade .g0 { color: var(--bad); } .grade .g1 { color: var(--signal); } .grade .g2 { color: var(--accent); } .grade .g3 { color: var(--good); }
@media (max-width: 460px) { .grade { grid-template-columns: repeat(2, 1fr); } }

/* Accueil */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr; } }
.ring { --p: 0; width: 132px; height: 132px; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; max-width: 100%; }
.ring > div { width: 106px; height: 106px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; }
.ring b { font-size: 2.1rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
.ring small { display: block; font-family: var(--f-mono); font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.hero h2 { font-size: 1.8rem; }
.tasks { display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; text-decoration: none; background: var(--surface); }
.task:hover { background: var(--surface-2); }
.task .ic { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.task.ok .ic { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.task .ic svg { width: 14px; height: 14px; }
.task b { display: block; font-weight: 700; }
.task span.s { color: var(--muted); font-size: 0.85rem; }
.task .go { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.tile .n { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .l { font-size: 0.82rem; color: var(--muted); }
.skills { display: grid; gap: 10px; }
.skill { display: grid; grid-template-columns: 120px 1fr 48px; gap: 12px; align-items: center; font-size: 0.9rem; }
.skill .v { font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 420px) { .skill { grid-template-columns: 96px 1fr 44px; } }
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.ladder div { border-radius: 12px; padding: 10px 6px; text-align: center; background: var(--surface-2); font-weight: 800; }
.ladder div small { display: block; font-weight: 500; font-size: 0.7rem; color: var(--muted); }
.ladder .done { background: var(--accent-soft); color: var(--accent); }
.ladder .cur { background: var(--gold); color: #1d1405; }
.ladder .cur small { color: #3b2a0a; }
.boxes { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.boxes span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; max-width: 440px; }
.heat span { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); max-width: 100%; }
.heat .l1 { background: color-mix(in srgb, var(--accent) 35%, var(--surface-2)); }
.heat .l2 { background: color-mix(in srgb, var(--accent) 65%, var(--surface-2)); }
.heat .l3 { background: var(--accent); }
.hist { display: grid; gap: 6px; }
.hist div { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; font-size: 0.88rem; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.hist div:last-child { border-bottom: 0; }
.hist .d { font-family: var(--f-mono); color: var(--muted); font-size: 0.78rem; }
.ok-t { color: var(--good); font-weight: 700; } .ko-t { color: var(--bad); font-weight: 700; }
.method { display: grid; gap: 10px; }
.method div { display: grid; grid-template-columns: 30px 1fr; gap: 12px; }
.method .n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 800; display: grid; place-items: center; font-size: 0.85rem; }

.form { display: grid; gap: 14px; }
.form .row { display: grid; gap: 6px; }
.form label.lbl, .lbl { font-weight: 700; font-size: 0.9rem; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.checks label { display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--line); border-radius: 99px; padding: 6px 13px; cursor: pointer; font-size: 0.9rem; background: var(--surface); }
.checks input { accent-color: var(--accent); }
.review-list { display: grid; gap: 10px; }
.review-list .it { border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px; display: grid; gap: 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 0.9rem; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 10px 30px rgb(0 0 0 / 0.25); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } .btn { transition: none; } }
</style>

<header class="band">
  <div class="wrap band-row">
    <div class="logo">
      <div class="mark" aria-hidden="true">EN</div>
      <div><h1>English Daily Lab</h1><div class="sub" id="subLabel">Anglais pro &amp; général</div></div>
    </div>
    <div class="band-stats" aria-live="polite">
      <span class="pill level" id="mLevel" title="Votre niveau actuel">—</span>
      <span class="pill" title="Jours d'affilée"><span id="mStreak">0</span>&nbsp;j de suite</span>
      <span class="pill" title="Cartes apprises"><span id="mLearned">0</span>&nbsp;cartes</span>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <a href="#accueil" data-v="accueil">Accueil</a>
    <a href="#lecon" data-v="lecon">Leçon du jour</a>
    <a href="#revision" data-v="revision">Révision<span class="count" id="tabDue" hidden></span></a>
    <a href="#entrainement" data-v="entrainement">Entraînement</a>
    <a href="#prononciation" data-v="prononciation">Prononciation</a>
    <a href="#niveau" data-v="niveau">Niveau &amp; examens</a>
    <a href="#profil" data-v="profil">Profil</a>
  </div>
</nav>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>

<script src="data.js"></script>
<script src="data-general.js"></script>
<script>
(() => {
"use strict";
/* ================= Utilitaires ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (k, n) => { const [y, m, d] = k.split("-").map(Number); const x = new Date(y, m - 1, d); x.setDate(x.getDate() + n); return dkey(x); };

  return pct(all.filter((x) => isLearned(x.id)).length, all.length);
}

/* ================= Questions de test et d'entraînement ================= */
function distractors(it, field, n = 3) {
  const val = field(it);
  const same = shuffle(itemsOf((x) => x.t === it.t && x.id !== it.id && x.lvl === it.lvl && field(x) && field(x) !== val));
  const other = shuffle(itemsOf((x) => x.t === it.t && x.id !== it.id && field(x) && field(x) !== val));
  const out = [];
  for (const x of [...same, ...other]) { const v = field(x); if (!out.includes(v) && v !== val) out.push(v); if (out.length >= n) break; }
  return out;
}
function mcq(base, correct, wrong) { const opts = shuffle([correct, ...wrong]); return { ...base, opts, ans: opts.indexOf(correct) }; }
function vocabQ(it, reverse = false) {
  if (reverse) return mcq({ sk: "vocab", lvl: it.lvl, item: it.id, prompt: `Comment dit-on « ${it.fr} » en anglais ?`, say: null, sayAfter: it.en }, it.en, distractors(it, (x) => x.en));
  return mcq({ sk: "vocab", lvl: it.lvl, item: it.id, prompt: it.t === "w" ? `Que signifie « ${it.en} » ?` : `Que veut dire : « ${it.en} »`, say: it.en }, it.fr, distractors(it, (x) => x.fr));
}
function listenQ(it) {
  return mcq({ sk: "listen", lvl: it.lvl, item: it.id, prompt: "Écoutez. Que signifie cette phrase ?", say: sentence(it), audioOnly: true, reveal: sentence(it) }, sentenceFr(it), distractors(it, sentenceFr));
}
function grammarQ(g, lvl) { return mcq({ sk: "grammar", lvl, prompt: g[0], explain: g[3] }, g[1][g[2]], g[1].filter((_, k) => k !== g[2])); }
function dictQ(it) { return { sk: "dict", lvl: it.lvl, item: it.id, prompt: "Écrivez la phrase entendue.", say: sentence(it), text: sentence(it), tr: sentenceFr(it) }; }
const genItems = (t, l) => itemsOf((x) => x.dom === "gen" && x.t === t && x.lvl === l);

function buildPlacement() {
  const qs = [];
  for (const L of LEVELS) {
    const w = shuffle(genItems("w", L)), e = shuffle(genItems("e", L));
    qs.push(vocabQ(w[0]), vocabQ(w[1]), vocabQ(e[0]));
    shuffle(window.EN_GRAMMAR[L]).slice(0, 2).forEach((g) => qs.push(grammarQ(g, L)));
    qs.push(listenQ(w[2]), listenQ(e[1]));
    if (["B1", "B2", "C1"].includes(L)) qs.push(dictQ(w[3]));
  }
  return qs;
}
function buildExam(target) {
  const pool = shuffle(itemsOf((x) => x.lvl === target && (x.dom === "gen" || S.prefs.domains.includes(x.dom))));
  const learned = pool.filter((x) => isLearned(x.id)), rest = pool.filter((x) => !isLearned(x.id));
  const ordered = [...learned.slice(0, 5), ...rest, ...learned.slice(5)];
  const qs = [];
  const take = (n) => ordered.splice(0, n);
  take(8).forEach((it, k) => qs.push(vocabQ(it, k % 3 === 2)));
  take(6).forEach((it) => qs.push(listenQ(it)));
  shuffle(window.EN_GRAMMAR[target]).slice(0, 6).forEach((g) => qs.push(grammarQ(g, target)));
  take(2).forEach((it) => qs.push(dictQ(it)));
  return shuffle(qs.slice(0, 20)).concat(qs.slice(20));
}
function practicePool(src) {
  const cur = curLevel(), nx = nextLvl(cur);
  if (src === "cards") {
    const day = S.days[dkey()] || { w: [], e: [] };
    const ids = [...new Set([...Object.keys(S.srs), ...day.w, ...day.e])].filter((id) => ITEMS.has(id));
    if (ids.length >= 6) return ids.map((id) => ITEMS.get(id));
  }
  if (src === "all") return [...ITEMS.values()];
  return itemsOf((x) => (x.lvl === cur || x.lvl === nx) && (x.dom === "gen" || S.prefs.domains.includes(x.dom)));
}
function buildPractice(mode, src) {
  const p = shuffle(practicePool(src));
  const cur = curLevel(), lvls = src === "all" ? LEVELS : [cur, nextLvl(cur)];
  const gram = shuffle(lvls.flatMap((l) => window.EN_GRAMMAR[l].map((g) => [g, l])));
  const qs = [];
  if (mode === "listen") p.slice(0, 10).forEach((it) => qs.push(listenQ(it)));
  else if (mode === "vocab") p.slice(0, 10).forEach((it, k) => qs.push(vocabQ(it, k % 2 === 1)));
  else if (mode === "grammar") gram.slice(0, 10).forEach(([g, l]) => qs.push(grammarQ(g, l)));
  else if (mode === "dict") p.slice(0, 6).forEach((it) => qs.push(dictQ(it)));
  else { // mélange
    p.slice(0, 4).forEach((it, k) => qs.push(vocabQ(it, k % 2 === 1)));
    p.slice(4, 7).forEach((it) => qs.push(listenQ(it)));
    gram.slice(0, 2).forEach(([g, l]) => qs.push(grammarQ(g, l)));
    p.slice(7, 8).forEach((it) => qs.push(dictQ(it)));
  }
  return shuffle(qs);
}
const MODE_NAME = { listen: "Compréhension orale", vocab: "Vocabulaire", grammar: "Grammaire", dict: "Dictée", mix: "Mélange complet" };
const SK_NAME = { vocab: "Vocabulaire", grammar: "Grammaire", listen: "Compréhension orale", dict: "Dictée", pron: "Prononciation" };

/* Déroulé d'un test (positionnement, examen, série) */
let T = null;
function startRun(kind, opts = {}) {
  stopAudio();
  let qs, title;
  if (kind === "placement") { qs = buildPlacement(); title = "Test de positionnement"; }
  else if (kind === "exam") { qs = buildExam(opts.target); title = `Examen de passage ${opts.target}`; }
  else { qs = buildPractice(opts.mode, opts.src); title = `Série · ${MODE_NAME[opts.mode]}`; }
  if (!qs.length) { toast("Pas assez de contenu pour cette série."); return; }
  T = { kind, title, qs, i: 0, res: [], fb: kind === "practice", opts, plays: 0, done: false };
  if (location.hash !== "#test") location.hash = "#test"; else render();
  window.scrollTo(0, 0);
}
function replayRun() { if (!T) return; T = { ...T, qs: T.qs.map((q) => (q.opts ? { ...mcq(q, q.opts[q.ans], q.opts.filter((_, k) => k !== q.ans)) } : q)), i: 0, res: [], done: false, plays: 0 }; render(); window.scrollTo(0, 0); }
function answer(r) {
  const q = T.qs[T.i];
  T.res[T.i] = r;
  addSkill(q.sk, q.sk === "dict" ? r.score : r.ok ? 1 : 0);
  bump(); save();
  if (!T.fb) nextQ(); else render();
}
function nextQ() {
  stopAudio();
  T.i++; T.plays = 0;
  if (T.i >= T.qs.length) finishRun();
  render(); window.scrollTo(0, 0);
}
function finishRun() {
  T.done = true;
  const by = {}, per = {};
  T.qs.forEach((q, k) => {
    const r = T.res[k] || { ok: false };
    by[q.sk] = by[q.sk] || [0, 0]; by[q.sk][0] += r.ok ? 1 : 0; by[q.sk][1]++;
    per[q.lvl] = per[q.lvl] || [0, 0]; per[q.lvl][0] += r.ok ? 1 : 0; per[q.lvl][1]++;
  });
  const ok = T.res.filter((r) => r && r.ok).length, score = pct(ok, T.qs.length);
  const rec = { d: dkey(), kind: T.kind, score, by };
  if (T.kind === "placement") {
    let reached = null;
    for (const L of LEVELS) { const a = per[L] || [0, 1]; if (a[0] / a[1] >= 0.6) reached = L; else break; }
    const lvl = reached || "A2";
    rec.lvl = lvl; rec.per = per; rec.below = !reached;
    S.level = lvl; S.levelHist.push({ d: dkey(), lvl, how: "Test de positionnement" });
    S.days[dkey()] && (S.days[dkey()] = { w: S.days[dkey()].w.filter(isLearned), e: S.days[dkey()].e.filter(isLearned) });
  } else if (T.kind === "exam") {
    const li = by.listen ? by.listen[0] / by.listen[1] : 1;
    rec.target = T.opts.target; rec.pass = score >= 75 && li >= 0.6;
    if (rec.pass && lvIdx(T.opts.target) > lvIdx(curLevel())) { S.level = T.opts.target; S.levelHist.push({ d: dkey(), lvl: T.opts.target, how: "Examen réussi" }); }
  } else rec.mode = T.opts.mode;
  T.rec = rec;
  S.tests.push(rec); if (S.tests.length > 80) S.tests = S.tests.slice(-80);
  save();
}

}

function viewTest() {
  if (!T) return `<div class="panel"><h3>Aucun test en cours</h3><div class="actions"><a class="btn primary" href="#niveau">Niveau &amp; examens</a></div></div>`;
  if (T.done) return viewResult();
  const q = T.qs[T.i], r = T.res[T.i];
  const prog = pct(T.i, T.qs.length);
  const head = `<section class="head"><div><div class="eyebrow">${esc(T.title)}</div><h2>Question ${T.i + 1} sur ${T.qs.length}</h2></div>
    <button class="btn ghost" data-quit="1">Quitter</button></section>
    <div class="bar"><span style="width:${prog}%"></span></div>`;
  let body = `<div class="meta"><span class="l"><span class="chip">${esc(SK_NAME[q.sk])}</span>${T.kind === "practice" ? `<span class="chip lv">${esc(q.lvl)}</span>` : ""}</span><span>${T.kind === "practice" ? "Correction immédiate" : "Réponse enregistrée sans correction"}</span></div>`;
  if (q.sk === "grammar") body += `<div class="prompt">${esc(q.prompt).replace("___", '<span class="blank">&nbsp;</span>')}</div>`;
  else if (q.sk === "dict") body += `<div class="prompt">${esc(q.prompt)}</div>`;
  else if (q.audioOnly) body += `<div class="prompt">${esc(q.prompt)}</div>`;
  else body += `<div class="prompt">${esc(q.prompt)}</div>`;
  if (q.say && canSpeak()) body += `<div class="actions">${audioBtns(q.say, q.audioOnly || q.sk === "dict" ? "Écouter" : "Écouter le mot", q.audioOnly || q.sk === "dict")}<span class="muted small">Réécoutez autant que nécessaire.</span></div>`;
  else if (q.audioOnly && !canSpeak()) body += `<div class="notice warn">Audio indisponible : voici la phrase. « ${esc(q.say)} »</div>`;
  if (q.sk === "dict") {
    if (!r) body += `<textarea id="dictInput" placeholder="Tapez la phrase ici…" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea><div class="actions"><button class="btn primary" data-dictok="1">Valider</button></div>`;
    else body += `<div class="result"><div class="score">${r.score} % · ${verdict(r.score)}</div>${diffHtml(r.cmp)}<div class="muted">${esc(q.tr)}</div></div>`;
  } else {
    body += `<div class="choices">${q.opts.map((o, k) => {
      const cls = r ? (k === q.ans ? "right" : k === r.pick ? "wrong" : "") : "";
      return `<button class="choice ${cls}" data-opt="${k}" ${r ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>`;
    if (!r) body += `<div class="actions"><button class="btn ghost" data-opt="-1">Je ne sais pas</button></div>`;
    if (r) {
      body += `<div class="result"><b class="${r.ok ? "ok-t" : "ko-t"}">${r.ok ? "Bonne réponse" : "Pas tout à fait"}</b>`;
      if (q.reveal) body += `<div>« ${esc(q.reveal)} »</div>`;
      if (q.sayAfter) body += `<div>${esc(q.sayAfter)}</div>`;
      if (q.explain) body += `<div class="muted">${esc(q.explain)}</div>`;
      body += `</div>`;
      if ((q.reveal || q.sayAfter) && canSpeak()) body += `<div class="actions">${audioBtns(q.reveal || q.sayAfter, "Réécouter")}${micBtn(q.reveal || q.sayAfter)}</div><div class="mic-out" hidden></div>`;
    }
  }
  if (r) body += `<div class="actions end"><button class="btn primary" data-next="1">${T.i + 1 < T.qs.length ? "Question suivante" : "Voir le résultat"}</button></div>`;
  return head + `<article class="card">${body}</article>`;
}
function viewResult() {
  const rec = T.rec, by = rec.by;
  const wrong = T.qs.map((q, k) => [q, T.res[k]]).filter(([, r]) => !r || !r.ok);
  let title, sub;
  if (T.kind === "placement") { title = `Votre niveau : ${rec.lvl}`; sub = rec.below ? "Le niveau A2 n'est pas encore validé : les leçons commencent par les bases et montent progressivement." : `${LV_NAME[rec.lvl]}. Les leçons sont maintenant réglées sur ${rec.lvl} et ${nextLvl(rec.lvl)}.`; }
  else if (T.kind === "exam") { title = rec.pass ? `Examen ${rec.target} réussi` : `Examen ${rec.target} : pas encore`; sub = rec.pass ? `Félicitations, vous passez au niveau ${rec.target}.` : "Il faut 75 % au total et 60 % en compréhension orale. Révisez les points ci-dessous et repassez-le quand vous voulez."; }
  else { title = `Score : ${rec.score} %`; sub = rec.score >= 90 ? "Excellent. Passez à une nouvelle série." : rec.score >= 70 ? "Bien. Refaites la même série pour viser 100 %." : "Refaites la même série : la répétition fixe les points manqués."; }
  return `<section class="panel hero">
      <div class="ring" style="--p:${rec.score}"><div><span><b>${rec.score}</b><small>sur 100</small></span></div></div>
      <div style="display:grid;gap:8px"><div class="eyebrow">${esc(T.title)}</div><h2>${esc(title)}</h2><p class="muted" style="margin:0">${esc(sub)}</p>
      <div class="actions">${T.kind === "practice" ? `<button class="btn primary" data-replay="1">${ICON.redo}Refaire la même série</button><button class="btn" data-practice="${esc(T.opts.mode)}">Nouvelle série</button>` : T.kind === "exam" ? `<button class="btn primary" data-exam="${esc(rec.target)}">${ICON.redo}Repasser l'examen</button>` : `<a class="btn primary" href="#lecon">Commencer mes leçons</a>`}<a class="btn" href="#niveau">Mes progrès</a></div></div>
    </section>
    <section class="panel"><h3>Détail par compétence</h3><div class="skills">${Object.entries(by).map(([sk, [ok, n]]) => `<div class="skill"><span>${esc(SK_NAME[sk])}</span><div class="bar"><span style="width:${pct(ok, n)}%"></span></div><span class="v">${ok}/${n}</span></div>`).join("")}</div>
    ${rec.per ? `<h3>Par niveau</h3><div class="skills">${LEVELS.map((L) => { const a = rec.per[L] || [0, 0]; return `<div class="skill"><span>${L}</span><div class="bar ${pct(a[0], a[1]) >= 60 ? "" : "gold"}"><span style="width:${pct(a[0], a[1])}%"></span></div><span class="v">${pct(a[0], a[1])} %</span></div>`; }).join("")}</div><p class="small muted" style="margin:0">Un niveau est validé à partir de 60 % de bonnes réponses, en partant de A2.</p>` : ""}</section>
    ${wrong.length ? `<section class="panel"><h3>À retravailler (${wrong.length})</h3><div class="review-list">${wrong.map(([q]) => {
      const good = q.sk === "dict" ? q.text : q.opts[q.ans];
      const listenText = q.reveal || q.sayAfter || (q.sk === "dict" ? q.text : q.say);
      return `<div class="it"><span class="small muted">${esc(SK_NAME[q.sk])} · ${esc(q.lvl)}</span><span>${q.sk === "grammar" ? esc(q.prompt.replace("___", good)) : q.reveal ? `« ${esc(q.reveal)} »` : esc(q.prompt)}</span>${q.sk !== "grammar" ? `<b>${esc(good)}</b>` : ""}${q.explain ? `<span class="small muted">${esc(q.explain)}</span>` : ""}${listenText && canSpeak() ? `<div class="actions">${audioBtns(listenText, "Écouter")}</div>` : ""}</div>`;
    }).join("")}</div></section>` : ""}`;
}

let pron = null;
function newPron() {
  const p = practicePool("cards");
  const it = pick(p);
  const useSentence = it.t === "e" || Math.random() < 0.5;
  pron = { it, text: useSentence ? sentence(it) : it.en };
}
function viewPron() {
  if (!pron) newPron();
  const it = pron.it, avg = skillPct("pron");
  return `<section class="head"><div><h2>Prononciation</h2><p>Shadowing : écoutez, répétez immédiatement en imitant le rythme et l'accent tonique, puis comparez. La reconnaissance vocale vérifie que vous êtes compris.</p></div></section>
    ${canListen() ? "" : `<div class="notice warn">La reconnaissance vocale n'est pas disponible ici. Écoutez et répétez à voix haute : le shadowing fonctionne aussi sans vérification. Dans Chrome ou Edge, le micro est disponible.</div>`}
    <div class="card">
      <div class="meta"><span class="l"><span class="chip">${esc(DOM[it.dom].short)}</span><span class="chip lv">${esc(it.lvl)}</span></span><span>Score moyen ${avg === null ? "–" : avg + " %"} · ${S.sk.pron[1]} essais</span></div>
      <div class="term ${pron.text === it.en && it.t === "w" ? "" : "expr"}">${esc(pron.text)}</div>
      ${pron.text === it.en && it.ipa ? `<div class="ipa">/${esc(it.ipa)}/</div>` : ""}
      ${it.t === "w" && it.tip ? `<div class="tip"><span class="k">Prononciation</span>${esc(it.tip)}</div>` : ""}
      ${it.t === "e" && it.fast ? `<div class="fast">À l'oral : ${esc(it.fast)}</div>` : ""}
      <div class="actions">${audioBtns(pron.text)}${canListen() ? `<button class="btn mic primary" data-mic="${esc(pron.text)}">${ICON.mic}Parler</button>` : ""}<button class="btn" data-nextpron="1">Suivant</button></div>
      <div class="mic-out" hidden></div>
    </div>
    <div class="panel"><h3>Les pièges classiques pour un francophone</h3>
      <ul class="muted" style="margin:0;padding-left:18px;display:grid;gap:5px">
        <li><b>L'accent tonique</b> : une syllabe est plus forte que les autres (va-li-DA-tion, PRO-to-col). Le français met tout au même niveau.</li>
        <li><b>Le « th »</b> : langue entre les dents, soufflé (<i>think</i>) ou vibré (<i>the</i>). Jamais « z » ni « s ».</li>
        <li><b>Le « h » aspiré</b> : on souffle (<i>heat, high</i>), sauf dans <i>hour, honest</i>.</li>
        <li><b>Voyelles courtes et longues</b> : <i>ship</i> /ɪ/ ≠ <i>sheep</i> /i/, <i>full</i> /ʊ/ ≠ <i>fool</i> /u/.</li>
        <li><b>Les mots réduits</b> : <i>to, of, and, can</i> deviennent « tuh, uv, un, kun ». C'est souvent ce qui bloque la compréhension.</li>
      </ul></div>`;
}

function viewLevel() {
  const lvl = curLevel(), nx = nextLvl(lvl), ready = readiness(nx);
  const learnedIds = Object.keys(S.srs).filter((id) => ITEMS.has(id));
  const boxes = [0, 0, 0, 0];
  for (const id of learnedIds) { const b = S.srs[id].b; boxes[b <= 1 ? 0 : b <= 3 ? 1 : b <= 5 ? 2 : 3]++; }
  const total = learnedIds.length || 1;
  const bcol = ["var(--bad)", "var(--signal)", "var(--accent)", "var(--good)"], blab = ["Nouvelles", "En cours", "Solides", "Maîtrisées"];
  const days = []; for (let i = 27; i >= 0; i--) days.push(addDays(dkey(), -i));
  const lv = (n) => (!n ? "" : n < 5 ? "l1" : n < 15 ? "l2" : "l3");
  const exams = S.tests.filter((t) => t.kind !== "practice").slice(-8).reverse();
  return `<section class="head"><div><h2>Niveau &amp; examens</h2><p>Votre niveau CECRL évolue par examens de passage. Chaque examen mélange vocabulaire, écoute, grammaire et dictée du niveau visé.</p></div></section>
    <section class="panel"><div class="ladder">${LEVELS.map((L) => `<div class="${L === lvl && S.level ? "cur" : lvIdx(L) < lvIdx(lvl) && S.level ? "done" : ""}">${L}<small>${LV_NAME[L]}</small></div>`).join("")}</div>
      ${S.level ? (lvl !== "C2" ? `<div style="display:grid;gap:8px"><div class="actions between"><span><b>Prochaine étape : ${nx}</b> <span class="muted">· ${ready} % des cartes ${nx} apprises</span></span></div><div class="bar gold"><span style="width:${ready}%"></span></div>
        <p class="small muted" style="margin:0">L'examen compte 22 questions. Il faut 75 % au total et 60 % en compréhension orale. Vous pouvez le passer quand vous voulez, aussi souvent que nécessaire.</p></div>
        <div class="actions"><button class="btn gold big" data-exam="${nx}">Passer l'examen ${nx}</button><button class="btn" data-placement="1">Refaire le test de positionnement</button></div>`
        : `<p class="muted" style="margin:0">Niveau maximal atteint. Les séries et révisions entretiennent vos acquis.</p><div class="actions"><button class="btn" data-placement="1">Refaire le test de positionnement</button></div>`)
        : `<div class="actions"><button class="btn primary big" data-placement="1">Passer le test de positionnement</button></div>`}
    </section>
    <section class="panel"><h3>Compétences</h3><div class="skills">${SK.map((sk) => { const v = skillPct(sk); return `<div class="skill"><span>${SK_NAME[sk]}</span><div class="bar"><span style="width:${v || 0}%"></span></div><span class="v">${v === null ? "–" : v + " %"}</span></div>`; }).join("")}</div>
      <p class="small muted" style="margin:0">Taux de réussite cumulé dans les tests, examens et séries. Dictée et prononciation : score moyen de ressemblance.</p></section>
    <section class="grid2">
      <div class="panel"><h3>Historique</h3>${exams.length ? `<div class="hist">${exams.map((t) => `<div><span class="d">${esc(frDate(t.d, { day: "numeric", month: "short", year: "2-digit" }))}</span><span>${t.kind === "placement" ? `Positionnement → ${esc(t.lvl)}` : `Examen ${esc(t.target)}`}</span><span class="${t.kind === "placement" || t.pass ? "ok-t" : "ko-t"}">${t.score} %</span></div>`).join("")}</div>` : `<p class="muted" style="margin:0">Vos tests et examens apparaîtront ici.</p>`}
        ${S.levelHist.length ? `<p class="small muted" style="margin:0">Niveau ${esc(S.levelHist[0].lvl)} le ${esc(frDate(S.levelHist[0].d, { day: "numeric", month: "long" }))}${S.levelHist.length > 1 ? `, puis ${S.levelHist.slice(1).map((h) => esc(h.lvl)).join(", ")}` : ""}.</p>` : ""}</div>
      <div class="panel"><h3>Mémoire</h3><div class="boxes">${boxes.map((n, i) => n ? `<span style="width:${(n / total) * 100}%;background:${bcol[i]}" title="${blab[i]} : ${n}"></span>` : "").join("")}</div>
        <div class="legend">${boxes.map((n, i) => `<span><i style="background:${bcol[i]}"></i>${blab[i]} · ${n}</span>`).join("")}</div>
        <h3>Activité sur 4 semaines</h3><div class="heat">${days.map((k) => `<span class="${lv(S.act[k])}" title="${esc(frDate(k))} : ${S.act[k] || 0} actions"></span>`).join("")}</div></div>
    </section>
    <section class="panel"><h3>La méthode, et pourquoi elle marche</h3><div class="method">
      <div><span class="n">1</span><span><b>Rappel actif</b> : on écoute, on cherche le sens, puis seulement on affiche. Se tester ancre mieux que relire (Roediger &amp; Karpicke, 2006).</span></div>
      <div><span class="n">2</span><span><b>Répétition espacée</b> : chaque carte revient juste avant l'oubli. L'effet le plus solide de la recherche sur la mémoire (Cepeda et al., 2006).</span></div>
      <div><span class="n">3</span><span><b>L'oreille d'abord</b> : le son avant l'écrit, dictées et écoute sans texte, pour entraîner le décodage de la parole (Field ; Vandergrift &amp; Goh).</span></div>
      <div><span class="n">4</span><span><b>Shadowing</b> : répéter juste après le modèle améliore prononciation et compréhension (Hamada, 2016).</span></div>
      <div><span class="n">5</span><span><b>Niveau i + 1</b> : les leçons visent votre niveau et le suivant, assez difficile pour progresser sans décrocher (Krashen).</span></div>
      <div><span class="n">6</span><span><b>Blocs lexicaux et contexte</b> : expressions entières et phrases de votre métier, comme les natifs les emploient (Nation ; Lewis).</span></div>
      <div><span class="n">7</span><span><b>Entrelacement</b> : séries et révisions mélangent compétences et domaines, ce qui retient mieux que des blocs par thème (Rohrer, 2012).</span></div>
    </div></section>`;
}

    </section>`;
}

const VIEWS = ["accueil", "lecon", "revision", "entrainement", "prononciation", "niveau", "profil", "test"];
function render() {
  const h = (location.hash || "#accueil").slice(1);
  VIEW = VIEWS.includes(h) ? h : "accueil";
  document.querySelectorAll("nav.tabs a").forEach((a) => { if (a.dataset.v === VIEW) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  let html;
  if (!S.profile && VIEW !== "test") html = viewOnboarding();
  else html = { accueil: viewHome, lecon: viewLesson, revision: viewReview, entrainement: viewPractice, prononciation: viewPron, niveau: viewLevel, profil: viewProfile, test: viewTest }[VIEW]();
  app.innerHTML = html;
  updateHeader();
}
window.addEventListener("hashchange", () => { revShown = false; stopAudio(); render(); window.scrollTo(0, 0); });

/* ================= Génération avec Claude ================= */
async function generate(t, btn) {
  if (!CL.sample) return;
  const status = $("#genStatus");
  btn.disabled = true; if (status) status.innerHTML = '<span class="spin"></span> Claude prépare vos cartes…';
  const lvl = curLevel(), nx = nextLvl(lvl);
  const doms = ["gen", ...S.prefs.domains];
  const existing = itemsOf((x) => x.t === t).map((x) => x.en).slice(-350).join("; ");
  const spec = t === "w"
    ? `Return a JSON array of exactly 10 objects with keys: "dom" (one of: ${doms.join(", ")}), "lvl" ("${lvl}" or "${nx}"), "en" (English word or short term), "ipa" (General American IPA, no slashes), "fr" (French translation), "ex" (natural English example sentence), "exFr" (French translation of the example), "tip" (one short pronunciation tip in French for a French speaker, or empty string).`
    : `Return a JSON array of exactly 10 objects with keys: "dom" (one of: ${doms.join(", ")}), "lvl" ("${lvl}" or "${nx}"), "en" (a full natural sentence using a common spoken expression, idiom or phrasal verb), "fr" (natural French equivalent), "note" (one short usage note in French that names the expression), "fast" (how it sounds in fast natural speech, syllables joined by hyphens, stressed syllables in CAPS).`;
  const prompt = `You create English flashcards for a French native speaker who works as a pharmaceutical CQV/CSV validation engineer. Current CEFR level: ${lvl}; goal: ${S.profile?.goal || "C2"}. Domains: "gen" = general everyday and cultural English (about half of the items), "pharma" = GMP/quality, "cqv" = commissioning, qualification, computer system validation, "eng" = industrial engineering, "pro" = general professional English, "travel" = travel. Use only these domains: ${doms.join(", ")}. Pick genuinely useful ${t === "w" ? "vocabulary" : "expressions"} at level ${lvl} or ${nx} that native speakers really use. Do not repeat any of these: ${existing}.\n\n${spec}\nReply with only the JSON array.`;
  try {
    const arr = await CL.sample.json(prompt, { modelTier: "default" });
    if (!Array.isArray(arr)) throw new Error("format");
    let n = 0;
    for (const o of arr) {
      if (!o || typeof o.en !== "string") continue;
      const dom = DOM[o.dom] ? o.dom : "gen", lv = LEVELS.includes(o.lvl) ? o.lvl : lvl;
      const it = t === "w"
        ? { id: `w|${dom}|${o.en.trim()}`, t, dom, lvl: lv, en: o.en.trim(), ipa: String(o.ipa || "").replace(/^\/|\/$/g, ""), fr: String(o.fr || ""), ex: String(o.ex || ""), exFr: String(o.exFr || ""), tip: String(o.tip || ""), gen: 1 }
        : { id: `e|${dom}|${o.en.trim()}`, t, dom, lvl: lv, en: o.en.trim(), fr: String(o.fr || ""), note: String(o.note || ""), fast: String(o.fast || ""), gen: 1 };
      if (addItem(it, null)) { CUSTOM.push(it); n++; }
    }
    saveCustom();
    toast(n ? `${n} nouvelles cartes ajoutées.` : "Aucune nouvelle carte : réessayez.");
    render();
  } catch (e) {
    btn.disabled = false;
    if (status) status.textContent = e && e.code === "rate_limited" ? "Trop de demandes, réessayez dans quelques minutes." : e && e.code === "not_granted" ? "L'accès à Claude n'est pas autorisé pour cette page." : "La génération a échoué, réessayez.";
  }
}

/* ================= Événements ================= */
app.addEventListener("submit", (ev) => {
  if (ev.target.id !== "profileForm") return;
  ev.preventDefault();
  saveProfileFromForm();
  startRun("placement");
});
function saveProfileFromForm() {
  const name = $("#pName").value.trim() || "Vous";
  S.profile = { name, job: $("#pJob").value.trim(), goal: $("#pGoal").value, created: S.profile?.created || dkey() };
  S.prefs.daily = Number($("#pDaily").value) || 10;
  S.prefs.genShare = Number($("#pShare").value) || 0.5;
  const doms = [...app.querySelectorAll("[data-pdom]")].filter((x) => x.checked).map((x) => x.dataset.pdom);
  S.prefs.domains = doms;
  save();
}
app.addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (!b) return;
  const ds = b.dataset;
  if (ds.say) { speak(ds.say, !!ds.slow, b); return; }
  if (ds.mic) {
    const holder = b.closest(".card, .panel, .it");
    const out = holder ? holder.querySelector(".mic-out") : null;
    const target = ds.mic;
    if (out) { out.hidden = false; out.innerHTML = `<div class="result"><span class="partial">Parlez maintenant… (cliquez à nouveau pour arrêter)</span></div>`; }
    startListening(b, (p) => { if (out && p) out.innerHTML = `<div class="result"><span class="partial">${esc(p)}</span></div>`; }, (text) => {
      if (!out) return;
      if (!text) { out.innerHTML = `<div class="result"><span class="muted">Rien n'a été entendu. Rapprochez-vous du micro et réessayez.</span></div>`; return; }
      const r = compare(target, text);
      out.innerHTML = `<div class="result"><div class="score">${r.score} % · ${verdict(r.score)}</div>${diffHtml(r)}<div class="small muted">Compris : « ${esc(text)} »</div></div>`;
      addSkill("pron", r.score); S.pronDay = dkey(); bump(); save(); updateHeader();
    });
    return;
  }
  if (ds.skiptest !== undefined && ds.skiptest) { saveProfileFromForm(); if (!S.level) { S.level = "B1"; S.levelHist.push({ d: dkey(), lvl: "B1", how: "Choisi sans test" }); } save(); location.hash = "#accueil"; render(); return; }
  if (ds.toggle) { shown.has(ds.toggle) ? shown.delete(ds.toggle) : shown.add(ds.toggle); render(); return; }
  if (ds.hideall) { shown.clear(); render(); return; }
  if (ds.learn) { learn(ds.learn, !isLearned(ds.learn)); render(); return; }
  if (ds.learnall) { ensureToday()[ds.learnall].forEach((id) => learn(id, true)); render(); toast("Cartes envoyées en révision pour demain."); return; }
  if (ds.ltab) { lessonTab = ds.ltab; render(); return; }
  if (ds.gen) { generate(ds.gen, b); return; }
  if (ds.showans) { revShown = true; render(); return; }
  if (ds.hideans) { revShown = false; render(); return; }
  if (ds.grade) { const id = revQueue[0], g = Number(ds.grade); grade(id, g); revQueue.shift(); if (g === 0) revQueue.push(id); revShown = false; render(); return; }
  if (ds.src) { prSrc = ds.src; render(); return; }
  if (ds.practice) { startRun("practice", { mode: ds.practice, src: prSrc }); return; }
  if (ds.exam) { startRun("exam", { target: ds.exam }); return; }
  if (ds.placement) { startRun("placement"); return; }
  if (ds.replay) { replayRun(); return; }
  if (ds.quit) { stopAudio(); T = null; location.hash = S.profile ? "#niveau" : "#accueil"; return; }
  if (ds.opt !== undefined && T && !T.done) { const k = Number(ds.opt); const q = T.qs[T.i]; answer({ ok: k === q.ans, pick: k }); return; }
  if (ds.dictok && T) {
    const v = ($("#dictInput").value || "").trim();
    if (!v) { toast("Écrivez d'abord ce que vous avez entendu."); return; }
    const q = T.qs[T.i], cmp = compare(q.text, v);
    answer({ ok: cmp.score >= 80, score: cmp.score, cmp }); return;
  }
  if (ds.next && T) { nextQ(); return; }
  if (ds.nextpron) { newPron(); render(); return; }
  if (b.id === "btnExport") {
    const txt = JSON.stringify({ state: S, custom: CUSTOM });
    const done = () => toast("Sauvegarde copiée. Collez-la dans une note pour la garder.");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(() => showExport(txt)); else showExport(txt);
    return;
  }
  if (b.id === "btnImportShow") { $("#importBox").hidden = false; return; }
  if (b.id === "btnImport") {
    try {
      const o = JSON.parse($("#importText").value); if (!o.state) throw 0;
      S = mergeState(o.state);
      (o.custom || []).forEach((c) => { const n = normalizeCustom(c); if (n && addItem(n, null)) CUSTOM.push(n); });
      save(); saveCustom(); revQueue = null; toast("Sauvegarde restaurée."); render();
    } catch (e) { toast("Ce texte n'est pas une sauvegarde valide."); }
  }
});
function showExport(txt) { $("#importBox").hidden = false; const t = $("#importText"); t.value = txt; t.select(); toast("Copiez le texte sélectionné."); }
app.addEventListener("change", (ev) => {
  const el = ev.target;
  if (el.id === "optAudioFirst") { S.prefs.audioFirst = el.checked; save(); render(); }
  else if (el.dataset.dom) {
    const set = new Set(S.prefs.domains); el.checked ? set.add(el.dataset.dom) : set.delete(el.dataset.dom);
    S.prefs.domains = PRO.filter((k) => set.has(k)); save();
  }
  else if (el.id === "sName" || el.id === "sJob" || el.id === "sGoal") { S.profile = { ...(S.profile || {}), name: $("#sName").value.trim() || "Vous", job: $("#sJob").value.trim(), goal: $("#sGoal").value }; save(); updateHeader(); }
  else if (el.id === "sDaily") { S.prefs.daily = Number(el.value); save(); }
  else if (el.id === "sShare") { S.prefs.genShare = Number(el.value); save(); }
  else if (el.id === "optEngine") { S.prefs.engine = el.value; save(); render(); }
  else if (el.id === "optVoice") { S.prefs.voiceName = el.value; save(); }
  else if (el.id === "optAccent") { S.prefs.accent = el.value; S.prefs.voiceName = ""; save(); render(); }
  else if (el.id === "optRate") { S.prefs.rate = Number(el.value); save(); render(); }
  else if (el.id === "optPrimer") { S.prefs.primer = el.checked; warmed = false; save(); }
  else if (el.id === "optLead") { S.prefs.lead = Number(el.value); save(); render(); }
});
app.addEventListener("keydown", (ev) => {
  if (ev.target.id === "dictInput" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); const b = app.querySelector("[data-dictok]"); if (b) b.click(); }
});

render();
initClaude();
})();
</script>
